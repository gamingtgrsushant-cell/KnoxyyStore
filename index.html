<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knoxyy Store</title>
<style>
:root{--bg:#07070d;--card:rgba(255,255,255,.05);--tx:#fff;--mu:#a9a9bd;--ac:#ff7a00;--ac2:#ff2d55;--bd:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#orb{position:fixed;left:0;top:0;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,20,.28),rgba(255,45,85,.12) 40%,transparent 70%);pointer-events:none;z-index:1;will-change:transform}
main{position:relative;z-index:2}
header{text-align:center;padding:56px 16px 10px;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.tag{display:inline-block;padding:6px 14px;border:1px solid var(--bd);border-radius:99px;color:var(--mu);font-size:13px;letter-spacing:.12em;backdrop-filter:blur(8px)}
h1{margin:16px 0 8px;font-size:clamp(28px,6vw,58px);font-weight:900;letter-spacing:-.02em;background:linear-gradient(90deg,#ffb347,var(--ac),var(--ac2),var(--ac),#ffb347);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
header p{color:var(--mu);margin:0}
.grid{max-width:1020px;margin:34px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;perspective:900px}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:24px;cursor:pointer;text-align:left;color:var(--tx);font:inherit;backdrop-filter:blur(14px);transition:transform .18s ease,border-color .3s,box-shadow .3s;overflow:hidden;animation:rise .8s cubic-bezier(.2,.8,.2,1) both;transform-style:preserve-3d}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,122,0,.22),transparent 60%);opacity:0;transition:opacity .3s}
.card:hover{border-color:rgba(255,122,0,.7);box-shadow:0 12px 40px rgba(255,80,0,.2)}
.card:hover::before{opacity:1}
.card>*{position:relative}
.n{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));font-weight:800}
.card h3{margin:14px 0 4px;font-size:21px}
.card small{color:var(--mu)}
.card .p{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-weight:800;font-size:22px;color:#ffb066}
.card .p span{font-size:13px;color:var(--mu);font-weight:500}
.ov{position:fixed;inset:0;background:rgba(3,3,8,.0);backdrop-filter:blur(0);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;transition:background .35s,backdrop-filter .35s}
.ov.on{display:flex}
.ov.show{background:rgba(3,3,8,.72);backdrop-filter:blur(10px)}
.box{position:relative;background:linear-gradient(160deg,#17172a,#0e0e1a);border:1px solid rgba(255,122,0,.6);border-radius:24px;max-width:480px;width:100%;max-height:92%;overflow:auto;padding:28px;box-shadow:0 0 80px rgba(255,80,0,.25);opacity:0;transform:translateY(40px) scale(.86) rotateX(14deg);transition:all .5s cubic-bezier(.2,1.2,.3,1)}
.ov.show .box{opacity:1;transform:none}
.box h2{margin:0 0 6px;font-size:26px}
.box .d{color:var(--mu)}
.price{font-size:44px;font-weight:900;margin:12px 0;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.price s{font-size:18px;color:var(--mu);-webkit-text-fill-color:var(--mu);margin-left:8px;font-weight:500}
.box ul{list-style:none;padding:0;margin:14px 0}
.box li{padding:9px 0 9px 28px;position:relative;color:#ddd;border-bottom:1px solid var(--bd);opacity:0;transform:translateX(-18px);transition:all .45s ease}
.box li::before{content:"✓";position:absolute;left:0;color:var(--ac);font-weight:900}
.ov.show li{opacity:1;transform:none}
.btn{display:block;text-align:center;text-decoration:none;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-weight:800;padding:14px;border-radius:12px;margin-top:18px;border:0;width:100%;font-size:16px;cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(255,60,40,.45)}
.btn.g{background:none;border:1px solid var(--bd);margin-top:10px;font-weight:600}
.warn{max-width:1020px;margin:8px auto 50px;padding:0 16px;text-align:center;color:var(--mu);font-size:13px}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:250% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.contact{max-width:1020px;margin:0 auto 60px;padding:0 16px;text-align:center}
.wa{display:inline-flex;align-items:center;gap:14px;padding:14px 30px 14px 18px;border-radius:99px;background:linear-gradient(135deg,#6d79ff,#4752c4);color:#fff;text-decoration:none;font-weight:800;font-size:18px;box-shadow:0 0 0 0 rgba(88,101,242,.6);animation:pulse 2.2s infinite;transition:transform .2s}
.wa:hover{transform:translateY(-3px) scale(1.03)}
.wa svg{width:38px;height:38px;flex:none}
.wa small{display:block;font-weight:500;font-size:13px;opacity:.9}
.contact p{color:var(--mu);margin:0 0 14px}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(88,101,242,0)}100%{box-shadow:0 0 0 0 rgba(88,101,242,0)}}
</style>
</head>
<body>
<canvas id="bg"></canvas><div id="orb"></div>
<main>
<header><span class="tag">FREE FIRE PC / EMULATOR HUB</span><h1>Knoxyy Store</h1><p>Kisi bhi section par click karo, price aur details dekho</p></header>
<div class="grid" id="grid"></div>
<div class="warn">Koi bhi tweak lagane se pehle Restore Point zaroor banao. Results har system par alag ho sakte hain.</div>
<div class="contact"><p>Kuch puchna hai ya buy karna hai?</p>
<a class="wa" href="https://discord.gg/H2PRt4JKBU" target="_blank" rel="noopener">
<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#fff"/><path d="M33.500 15.500c-1.700-.8-3.500-1.400-5.400-1.700l-.7 1.400c-2-.3-4-.3-6 0l-.7-1.400c-1.900.3-3.700.9-5.400 1.700-3.400 5.100-4.300 10-3.900 14.800 2.200 1.600 4.300 2.600 6.400 3.200l1.400-2.300c-.8-.3-1.500-.7-2.200-1.100l.5-.4c4.200 1.900 8.700 1.900 12.900 0l.5.400c-.7.400-1.400.8-2.200 1.100l1.400 2.300c2.100-.6 4.200-1.600 6.400-3.200.5-5.600-.9-10.500-3.600-14.800z" fill="#5865F2"/><ellipse cx="19.500" cy="24.500" rx="2.200" ry="2.600" fill="#fff"/><ellipse cx="28.500" cy="24.500" rx="2.200" ry="2.600" fill="#fff"/></svg>
<span>Contact Us<small>Join our Discord server</small></span></a></div>
</main>
<div class="ov" id="ov"><div class="box" id="box"></div></div>
<script>
// ====== EDIT HERE ======
var DISCORD="https://discord.gg/H2PRt4JKBU";
var ITEMS=[
{n:"01",name:"Sensitivity (Sensi)",sub:"Low / Mid / High / PC packs",price:599,info:"Device ke hisaab se ready sensi values.",list:["Low, Mid, High aur PC/Emulator sensi","General, Red Dot, 2x, 4x, AWM, Free Look","Pro player sensi sheet","Apne DPI ke hisaab se adjust guide"]},
{n:"02",name:"Optimization",sub:"FPS, Ping, Lag Fix",price:1199,info:"Game smooth chalane ke complete guides.",list:["Low-end FPS boost guide","Graphics settings guide","Lag / ping fix guide","Storage cleanup guide"]},
{n:"03",name:"Bat Files",sub:"Cleaner / Booster",price:499,info:"One-click cleaning scripts (Run as Administrator).",list:["Temp, Prefetch, cache cleaner","RAM cleaner","Network reset + DNS flush","Restore Point.bat included"]},
{n:"04",name:"Debloater",sub:"Windows 10 / 11",price:299,info:"Faltu Windows apps aur services hatao.",list:["Win 10 aur Win 11 debloat script","Startup apps disable guide","Unwanted services list","Telemetry off guide"]},
{n:"05",name:"Emulator",sub:"Best config, VT, Keymap",price:1499,info:"Emulator ke best config aur setup.",list:["Best emulator list (Low/Mid/High PC)","CPU, RAM, resolution, DPI config","Virtualization (VT) enable guide","Keymapping setup guide"]},
{n:"06",name:"Registry",sub:"Registry edits + Undo .reg",price:299,info:"Registry pack, undo file ke saath.",list:["Menu show delay reduce","Network throttling index","System responsiveness","GPU priority / games task","Undo / Default .reg included"]},
{n:"07",name:"Tweaks",sub:"Windows & PC tweaks",price:399,info:"Windows ki settings ke tweaks jo FPS aur smoothness badhate hain.",list:["High performance power plan","Game Mode + Xbox Game Bar off","Visual effects off guide","Mouse / keyboard lag tweaks","Network adapter tweaks"]}
];
var BUNDLE_PRICE=3799; // Full bundle ka price yahan badlo
// =======================
var inr=function(x){return "₹"+x.toLocaleString("en-IN")};
var total=ITEMS.reduce(function(a,b){return a+b.price},0);
var grid=document.getElementById("grid"),ov=document.getElementById("ov"),box=document.getElementById("box");
function mk(it,i,bundle){
 var b=document.createElement("button");b.className="card";b.style.animationDelay=(i*0.08)+"s";
 b.innerHTML='<span class="n">'+(bundle?"★":it.n)+'</span><h3>'+it.name+'</h3><small>'+it.sub+'</small><div class="p">'+inr(it.price)+'<span>Details →</span></div>';
 b.onclick=function(){show(it,bundle)};
 b.onmousemove=function(e){var r=b.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  b.style.setProperty("--mx",x+"px");b.style.setProperty("--my",y+"px");
  b.style.transform="rotateY("+((x/r.width-.5)*10)+"deg) rotateX("+(-(y/r.height-.5)*10)+"deg) translateY(-4px)"};
 b.onmouseleave=function(){b.style.transform=""};
 grid.appendChild(b);
}
ITEMS.forEach(function(it,i){mk(it,i)});
mk({name:"Full Bundle",sub:"Sab 7 packs ek saath (best value)",price:BUNDLE_PRICE},7,true);
function show(it,bundle){
 var list=bundle?ITEMS.map(function(x){return x.name+" ("+inr(x.price)+")"}):it.list;
 var info=bundle?"Saare 7 packs ek saath, alag lene se sasta.":it.info;
 var old=bundle?"<s>"+inr(total)+"</s>":"";
 box.innerHTML='<h2>'+it.name+'</h2><div class="d">'+info+'</div><div class="price">'+inr(it.price)+old+'</div><ul>'+
  list.map(function(l,i){return '<li style="transition-delay:'+(0.25+i*0.07)+'s">'+l+'</li>'}).join("")+
  '</ul><a class="btn" href="'+DISCORD+'" target="_blank" rel="noopener">Buy on Discord</a><button class="btn g" id="cl">Close</button>';
 ov.classList.add("on");void ov.offsetWidth;ov.classList.add("show");
 document.getElementById("cl").onclick=hide;
}
function hide(){ov.classList.remove("show");setTimeout(function(){ov.classList.remove("on")},350)}
ov.onclick=function(e){if(e.target===ov)hide()};
document.onkeydown=function(e){if(e.key==="Escape")hide()};
// ---- cursor-following background ----
var cv=document.getElementById("bg"),cx=cv.getContext("2d"),orb=document.getElementById("orb"),W,H,P=[],M={x:-999,y:-999},O={x:innerWidth/2,y:innerHeight/3};
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;var n=Math.min(110,Math.floor(W*H/14000));P=[];for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4})}
rs();addEventListener("resize",rs);
function mv(e){var t=e.touches?e.touches[0]:e;M.x=t.clientX;M.y=t.clientY}
addEventListener("mousemove",mv);addEventListener("touchmove",mv,{passive:true});
(function loop(){
 cx.clearRect(0,0,W,H);
 O.x+=(M.x-O.x)*.08;O.y+=(M.y-O.y)*.08;
 if(M.x>-900)orb.style.transform="translate("+O.x+"px,"+O.y+"px)";
 for(var i=0;i<P.length;i++){var p=P[i],dx=M.x-p.x,dy=M.y-p.y,d=Math.sqrt(dx*dx+dy*dy);
  if(d<200){p.vx+=dx/d*.04;p.vy+=dy/d*.04}
  p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;
  if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
  cx.fillStyle=d<200?"rgba(255,140,40,.9)":"rgba(255,255,255,.35)";cx.beginPath();cx.arc(p.x,p.y,d<200?2.4:1.5,0,6.283);cx.fill();
  for(var j=i+1;j<P.length;j++){var q=P[j],ax=p.x-q.x,ay=p.y-q.y,dd=ax*ax+ay*ay;
   if(dd<8500){var near=d<220;cx.strokeStyle="rgba("+(near?"255,110,30":"255,255,255")+","+((1-dd/8500)*(near?.5:.12))+")";cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}
  if(d<160){cx.strokeStyle="rgba(255,90,40,"+(1-d/160)*.6+")";cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(M.x,M.y);cx.stroke()}}
 requestAnimationFrame(loop)})();
</script>
</body>
</html>
